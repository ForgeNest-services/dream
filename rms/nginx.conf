server {
    listen 80;
    server_name _;

    # TanStack Start's Nitro server bundle doesn't serve dist/client itself —
    # it only handles SSR document requests and server functions. Any request
    # that matches a real file under dist/client (hashed JS/CSS, favicon,
    # manifest, PWA icons, sw.js, robots.txt, ...) is served directly by
    # nginx; everything else falls through to the Bun/Nitro SSR process.

    root /app/dist/client;

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri @ssr;
    }

    location @ssr {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
