services:
  api: &python-service
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: srota-api
    env_file:
      - .env
    ports:
      - "8006:8000"
    volumes:
      - /var/log/template:/app/logs
      - /etc/localtime:/etc/localtime:ro
    networks:
      - srota-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  postgres:
    build: ./backup/wal-archive
    container_name: srota-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET}
      - BACKUP_S3_REGION=${BACKUP_S3_REGION}
      - AWS_ACCESS_KEY_ID=${BACKUP_S3_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${BACKUP_S3_SECRET_ACCESS_KEY}
    command:
      - postgres
      - -c
      - archive_mode=${WAL_ARCHIVE_ENABLED}
      - -c
      - archive_command=/usr/local/bin/archive-wal.sh %p %f
      - -c
      - archive_timeout=1800
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - srota-network
    healthcheck:
      test:
        ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-backup:
    build: ./backup/postgres
    container_name: srota-postgres-backup
    restart: unless-stopped
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET}
      - BACKUP_S3_REGION=${BACKUP_S3_REGION}
      - AWS_ACCESS_KEY_ID=${BACKUP_S3_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${BACKUP_S3_SECRET_ACCESS_KEY}
      - RUN_IMMEDIATELY=${BACKUP_RUN_IMMEDIATELY:-true}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - srota-network

  minio-backup:
    build: ./backup/minio
    container_name: srota-minio-backup
    restart: unless-stopped
    environment:
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - BACKUP_S3_BUCKET=${BACKUP_S3_BUCKET}
      - BACKUP_S3_REGION=${BACKUP_S3_REGION}
      - AWS_ACCESS_KEY_ID=${BACKUP_S3_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${BACKUP_S3_SECRET_ACCESS_KEY}
      - BACKUP_SCHEDULE=${MINIO_BACKUP_SCHEDULE:-0 * * * *}
      - RUN_IMMEDIATELY=${BACKUP_RUN_IMMEDIATELY:-true}
    depends_on:
      minio:
        condition: service_started
    networks:
      - srota-network

  redis:
    image: redis:7-alpine
    container_name: srota-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - srota-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: srota-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - srota-network

  worker:
    <<: *python-service
    container_name: srota-worker
    command: python worker.py
    ports: []
    networks:
      - srota-network
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: srota-ui
    ports:
      - "3009:80"
    networks:
      - srota-network
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_ENVIRO: ${NEXT_PUBLIC_ENVIRO}
    container_name: srota-admin
    env_file:
      - .env
    ports:
      - "3006:3001"
    networks:
      - srota-network
    restart: unless-stopped

  # pms:
  #   build:
  #     context: ./pms
  #     dockerfile: Dockerfile
  #     args:
  #       VITE_API_URL: ${VITE_API_URL}
  #   container_name: srota-pms
  #   env_file:
  #     - .env
  #   ports:
  #     - "3007:80"
  #   networks:
  #     - srota-network
  #   restart: unless-stopped

  rms:
    build:
      context: ./rms
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: srota-rms
    env_file:
      - .env
    ports:
      - "3008:80"
    networks:
      - srota-network
    restart: unless-stopped

  ims:
    build:
      context: ./ims
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: srota-ims
    env_file:
      - .env
    ports:
      - "3010:80"
    networks:
      - srota-network
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  minio_data:

networks:
  srota-network:
    driver: bridge
