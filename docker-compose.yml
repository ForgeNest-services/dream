services:
  api: &python-service
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - /var/log/template:/app/logs
      - /etc/localtime:/etc/localtime:ro
    networks:
      - app-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - app-network

  worker:
    <<: *python-service
    container_name: worker
    command: python worker.py
    ports: []
    networks:
      - app-network
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: ui
    ports:
      - "3000:80"
    networks:
      - app-network
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_ENVIRO: ${NEXT_PUBLIC_ENVIRO}
    container_name: admin
    env_file:
      - .env
    ports:
      - "3001:3001"
    networks:
      - app-network
    restart: unless-stopped

  pms:
    build:
      context: ./pms
      dockerfile: Dockerfile
    container_name: pms
    ports:
      - "3002:3002"
    volumes:
      - ./pms/src:/app/src
      - ./pms/public:/app/public
      - ./pms/vite.config.ts:/app/vite.config.ts
      - ./pms/tsconfig.json:/app/tsconfig.json
    networks:
      - app-network
    restart: unless-stopped

  restro:
    build:
      context: ./restro
      dockerfile: Dockerfile
    container_name: restro
    ports:
      - "3003:3003"
    volumes:
      - ./restro/src:/app/src
      - ./restro/public:/app/public
      - ./restro/vite.config.ts:/app/vite.config.ts
      - ./restro/tsconfig.json:/app/tsconfig.json
    networks:
      - app-network
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  minio_data:

networks:
  app-network:
    driver: bridge
