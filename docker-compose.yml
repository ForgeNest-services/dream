services:
  api: &python-service
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: srota-api
    env_file:
      - .env
    ports:
      - "8006:8000"
    volumes:
      - /var/log/template:/app/logs
      - /etc/localtime:/etc/localtime:ro
    networks:
      - srota-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  postgres:
    image: postgres:15-alpine
    container_name: srota-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - srota-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: srota-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - srota-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: srota-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - srota-network

  worker:
    <<: *python-service
    container_name: srota-worker
    command: python worker.py
    ports: []
    networks:
      - srota-network
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: srota-ui
    ports:
      - "3009:80"
    networks:
      - srota-network
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}
        NEXT_PUBLIC_ENVIRO: ${NEXT_PUBLIC_ENVIRO}
    container_name: srota-admin
    env_file:
      - .env
    ports:
      - "3006:3001"
    networks:
      - srota-network
    restart: unless-stopped

  pms:
    build:
      context: ./pms
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: srota-pms
    env_file:
      - .env
    ports:
      - "3007:80"
    networks:
      - srota-network
    restart: unless-stopped

  rms:
    build:
      context: ./rms
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: srota-rms
    env_file:
      - .env
    ports:
      - "3008:80"
    networks:
      - srota-network
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
  minio_data:

networks:
  srota-network:
    driver: bridge
