services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - /var/log/template:/app/logs
    networks:
      - app-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - forge-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - forge-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *python-service
    container_name: worker
    command: python worker.py
    ports: []
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
  
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: ui
    env_file:
      - .env
    ports:
      - "3000:3000"
    networks:
      - app-network
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: admin
    env_file:
      - .env
    ports:
      - "3001:3001"
    networks:
      - app-network
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:

networks:
  forge-network:
    external: true