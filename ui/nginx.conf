server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # nginx's automatic directory-redirect (e.g. /blog -> /blog/, triggered
    # by the $uri/ clause below) builds its Location header from $host,
    # which never includes the port Docker maps this container to (3009 in
    # docker-compose). Relative redirects omit the host entirely, so the
    # browser resolves against whatever origin/port it's actually on.
    absolute_redirect off;

    # Remove .html extension
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Prevent access to hidden files
    location ~ /\. {
        deny all;
    }
}
