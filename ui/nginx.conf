server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # nginx's automatic directory-redirect (e.g. /blog -> /blog/, triggered
    # by the $uri/ clause below) builds its Location header from $host,
    # which never includes the port Docker maps this container to (3009 in
    # docker-compose). Relative redirects omit the host entirely, so the
    # browser resolves against whatever origin/port it's actually on.
    absolute_redirect off;

    # Remove .html extension
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # dist/output.css and dist/index.js are NOT fingerprinted — same
    # filename on every deploy, content changes each build. "immutable" is
    # wrong for these specifically: a browser that already cached the old
    # bytes will keep serving them for a year and silently miss every CSS/JS
    # change until a hard refresh. Short max-age + must-revalidate instead,
    # so a normal reload after a deploy actually picks up the new file.
    location = /dist/output.css {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }
    location = /dist/index.js {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    # Cache genuinely static assets (images, fonts, favicons) — these are
    # either fingerprinted or don't change post-deploy, so long-lived
    # immutable caching is actually correct here.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Prevent access to hidden files
    location ~ /\. {
        deny all;
    }
}
