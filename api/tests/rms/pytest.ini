[pytest]
# Stops pytest from climbing up to api/tests/conftest.py, which imports the
# full app (features.auth -> ... -> DATABASE_URL/REDIS_URL/sib_api_v3_sdk)
# for an in-container test's own reasons -- this suite runs on the HOST
# against the live srota-api container over real HTTP, no app import needed.
addopts = --confcutdir=.
