# Srota RMS (Restaurant POS — Vite + TanStack Start)
# Container:  srota-restro  (host :3008) — service is named `restro` internally
#                                          but publicly branded "Srota RMS"
# Deploy:     sudo cp nginx/srota-rms.conf /etc/nginx/sites-available/srota-rms
#             sudo ln -sf /etc/nginx/sites-available/srota-rms /etc/nginx/sites-enabled/
#             sudo nginx -t && sudo nginx -s reload
#             sudo certbot --nginx -d rms.srotaapps.com

server {
    listen 80;
    listen [::]:80;
    server_name rms.srotaapps.com;

    access_log /var/log/nginx/srota-rms.access.log;
    error_log  /var/log/nginx/srota-rms.error.log;

    # Same Vite HMR websocket setup as pms.
    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
