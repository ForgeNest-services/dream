# Srota RMS (Restaurant POS — Vite + TanStack Start)
# Container:  srota-rms  (host :3008)
# Deploy:     sudo cp nginx/srota-rms.conf /etc/nginx/sites-available/srota-rms
#             sudo ln -sf /etc/nginx/sites-available/srota-rms /etc/nginx/sites-enabled/
#             sudo nginx -t && sudo nginx -s reload
#             sudo certbot --nginx -d rms.srotaapps.com

server {
    listen 80;
    listen [::]:80;
    server_name rms.srotaapps.com;

    access_log /var/log/nginx/srota-rms.access.log;
    error_log  /var/log/nginx/srota-rms.error.log;

    # Proxies to the container's internal nginx (rms/nginx.conf, port 80
    # inside the container -> host 3008), which serves the built static
    # assets directly and forwards SSR requests to the Bun/Nitro process.
    # No WebSocket upgrade needed here anymore — rms runs a production
    # build now, not the Vite dev server, so there's no HMR socket to proxy.
    location / {
        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }
}
