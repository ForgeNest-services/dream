# Srota API (FastAPI + uvicorn)
# Container:  srota-api  (host :8006)
# Deploy:     sudo cp nginx/srota-api.conf /etc/nginx/sites-available/srota-api
#             sudo ln -sf /etc/nginx/sites-available/srota-api /etc/nginx/sites-enabled/
#             sudo nginx -t && sudo nginx -s reload
#             sudo certbot --nginx -d api.srotaapps.com

server {
    listen 80;
    listen [::]:80;
    server_name api.srotaapps.com;

    access_log /var/log/nginx/srota-api.access.log;
    error_log  /var/log/nginx/srota-api.error.log;

    # POST /uploads (menu item images) currently caps at 5 MB in the app,
    # keep some headroom so nginx doesn't cut the request before the app can
    # return its own 413.
    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:8006;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        # Bump if you add long-polling / SSE / websockets later.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
