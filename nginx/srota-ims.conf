# Srota IMS (Inventory management — Vite + TanStack Start)
# Container:  srota-ims  (host :3010)
# Deploy:     sudo cp nginx/srota-ims.conf /etc/nginx/sites-available/srota-ims
#             sudo ln -sf /etc/nginx/sites-available/srota-ims /etc/nginx/sites-enabled/
#             sudo nginx -t && sudo nginx -s reload
#             sudo certbot --nginx -d ims.srotaapps.com

server {
    listen 80;
    listen [::]:80;
    server_name ims.srotaapps.com;

    access_log /var/log/nginx/srota-ims.access.log;
    error_log  /var/log/nginx/srota-ims.error.log;

    # Proxies to the container's internal nginx (ims/nginx.conf, port 80
    # inside the container -> host 3010), which serves the built static
    # assets directly and forwards SSR requests to the Bun/Nitro process.
    # No WebSocket upgrade needed here — ims runs a production build, not
    # the Vite dev server, so there's no HMR socket to proxy.
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }
}
