# Srota admin dashboard (Next.js — Owner/Manager/Superadmin login)
# Container:  srota-admin  (Next.js standalone, host :3006)
# Deploy:     sudo cp nginx/srota-admin.conf /etc/nginx/sites-available/srota-admin
#             sudo ln -sf /etc/nginx/sites-available/srota-admin /etc/nginx/sites-enabled/
#             sudo nginx -t && sudo nginx -s reload
#             sudo certbot --nginx -d app.srotaapps.com

server {
    listen 80;
    listen [::]:80;
    server_name app.srotaapps.com;

    access_log /var/log/nginx/srota-admin.access.log;
    error_log  /var/log/nginx/srota-admin.error.log;

    # Next.js's _next/webpack-hmr uses websockets in dev; also fine in prod.
    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 60s;
    }
}
