# Srota media — MinIO S3 API (public-read image bucket)
# Container:  srota-minio  (host :9000 for the S3 API; :9001 is the private
#                           admin console, NOT proxied — reach it via SSH
#                           tunnel if you need it)
# Deploy:     sudo cp nginx/srota-media.conf /etc/nginx/sites-available/srota-media
#             sudo ln -sf /etc/nginx/sites-available/srota-media /etc/nginx/sites-enabled/
#             sudo nginx -t && sudo nginx -s reload
#             sudo certbot --nginx -d media.srotaapps.com

server {
    listen 80;
    listen [::]:80;
    server_name media.srotaapps.com;

    access_log /var/log/nginx/srota-media.access.log;
    error_log  /var/log/nginx/srota-media.error.log;

    # Cover the full 20 MB the api layer allows through /uploads so nginx
    # never truncates a legitimate request before MinIO sees it.
    client_max_body_size 20M;

    # Public URLs are built as `https://media.srotaapps.com/{bucket}/{key}`
    # by api/core/storage.py `build_public_url`. Path-style S3, no signing —
    # the bucket is public-read so any GET on the object works.
    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
