# Srota landing site (marketing)
# Container:  srota-ui  (nginx serving static HTML, published on host :3009)
# Deploy:     sudo cp nginx/srota-ui.conf /etc/nginx/sites-available/srota-ui
#             sudo ln -sf /etc/nginx/sites-available/srota-ui /etc/nginx/sites-enabled/
#             sudo nginx -t && sudo nginx -s reload
#             sudo certbot --nginx -d srotaapps.com -d www.srotaapps.com

server {
    listen 80;
    listen [::]:80;
    server_name srotaapps.com www.srotaapps.com;

    access_log /var/log/nginx/srota-ui.access.log;
    error_log  /var/log/nginx/srota-ui.error.log;

    location / {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }
}
