<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="Segoe UI, Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="420" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a2e">Srota RMS — System Architecture</text>

  <!-- ── Box 1: User / Browser ── -->
  <rect x="40" y="80" width="160" height="100" rx="10" fill="#e8f4fd" stroke="#2980b9" stroke-width="2"/>
  <text x="120" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a5276">User / Browser</text>
  <text x="120" y="138" text-anchor="middle" font-size="11" fill="#2c3e50">Chrome / Firefox</text>
  <text x="120" y="155" text-anchor="middle" font-size="11" fill="#2c3e50">Edge · Mobile</text>

  <!-- Arrow 1→2 -->
  <line x1="200" y1="130" x2="278" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="239" y="120" text-anchor="middle" font-size="10" fill="#555">HTTPS</text>

  <!-- ── Box 2: API Server ── -->
  <rect x="278" y="80" width="180" height="100" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="2"/>
  <text x="368" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#1e8449">API Server</text>
  <text x="368" y="138" text-anchor="middle" font-size="11" fill="#2c3e50">FastAPI · Python</text>
  <text x="368" y="155" text-anchor="middle" font-size="11" fill="#2c3e50">Nepal-hosted · Docker</text>

  <!-- Arrow 2→3 (down to DB) -->
  <line x1="368" y1="180" x2="368" y2="248" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="390" y="218" text-anchor="start" font-size="10" fill="#555">SQL</text>

  <!-- Arrow 2→4 (right to CBMS) -->
  <line x1="458" y1="130" x2="536" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="497" y="120" text-anchor="middle" font-size="10" fill="#555">HTTPS / JSON</text>

  <!-- ── Box 3: PostgreSQL ── -->
  <rect x="248" y="248" width="240" height="100" rx="10" fill="#fef9e7" stroke="#d4ac0d" stroke-width="2"/>
  <text x="368" y="287" text-anchor="middle" font-size="13" font-weight="bold" fill="#7d6608">PostgreSQL Database</text>
  <text x="368" y="307" text-anchor="middle" font-size="11" fill="#2c3e50">Invoice immutability enforced</text>
  <text x="368" y="324" text-anchor="middle" font-size="11" fill="#2c3e50">WAL enabled · Encrypted backups</text>

  <!-- ── Box 4: CBMS / IRD ── -->
  <rect x="536" y="80" width="200" height="100" rx="10" fill="#fdedec" stroke="#e74c3c" stroke-width="2"/>
  <text x="636" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#922b21">IRD CBMS</text>
  <text x="636" y="134" text-anchor="middle" font-size="11" fill="#2c3e50">cbapi.ird.gov.np</text>
  <text x="636" y="151" text-anchor="middle" font-size="11" fill="#2c3e50">Real-time bill sync</text>
  <text x="636" y="168" text-anchor="middle" font-size="11" fill="#2c3e50">/api/bill · /api/billreturn</text>

  <!-- ── Box 5: RQ Worker ── -->
  <rect x="536" y="248" width="200" height="100" rx="10" fill="#f5eef8" stroke="#8e44ad" stroke-width="2"/>
  <text x="636" y="287" text-anchor="middle" font-size="13" font-weight="bold" fill="#6c3483">Background Worker</text>
  <text x="636" y="307" text-anchor="middle" font-size="11" fill="#2c3e50">RQ Job Queue</text>
  <text x="636" y="324" text-anchor="middle" font-size="11" fill="#2c3e50">Async CBMS submission</text>

  <!-- Arrow Worker→CBMS -->
  <line x1="636" y1="248" x2="636" y2="180" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow API→Worker -->
  <line x1="458" y1="155" x2="520" y2="268" stroke="#555" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="495" y="225" text-anchor="middle" font-size="10" fill="#555">enqueue</text>

  <!-- ── Legend ── -->
  <rect x="40" y="370" width="820" height="32" rx="6" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <line x1="60" y1="386" x2="90" y2="386" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="98" y="390" font-size="11" fill="#444">Synchronous (HTTPS)</text>
  <line x1="220" y1="386" x2="250" y2="386" stroke="#555" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="258" y="390" font-size="11" fill="#444">Asynchronous (job queue)</text>

  <!-- Arrowhead marker -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>

</svg>
